name: CI - site e container
on:
  push:
    branches: [main, feature/entrega-final]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar site e rodapé da entrega
        run: node scripts/validate.mjs
      - name: Construir imagem
        run: docker build --file Containerfile --tag entrega-ci --build-arg VCS_REF=${{ github.sha }} .
      - name: Verificar site servido pelo container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name entrega-ci --publish 9000:80 entrega-ci
          trap 'docker logs entrega-ci; docker rm -f entrega-ci' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:9000/ -o /tmp/site.html
          cmp index.html /tmp/site.html
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:9000/styles.css -o /tmp/styles.css
          cmp styles.css /tmp/styles.css