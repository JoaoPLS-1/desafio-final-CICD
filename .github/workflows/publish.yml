name: Publicar imagem GHCR
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Construir imagem da main aprovada
        run: |
          docker build --file Containerfile --build-arg VCS_REF=${{ github.sha }} \
            --tag ghcr.io/joaopls-1/desafio-final-cicd:1.0 \
            --tag ghcr.io/joaopls-1/desafio-final-cicd:latest .
      - name: Testar imagem antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name release-test --publish 9000:80 ghcr.io/joaopls-1/desafio-final-cicd:1.0
          trap 'docker logs release-test; docker rm -f release-test' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:9000/ -o /tmp/site.html
          cmp index.html /tmp/site.html
      - name: Publicar versão e latest
        run: |
          docker push ghcr.io/joaopls-1/desafio-final-cicd:1.0
          docker push ghcr.io/joaopls-1/desafio-final-cicd:latest